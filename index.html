<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>旅行規劃</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Huninn&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header id="tripheader" class="frame">
  <div class="brand" id="brand"></div>
  <div class="tripsummary">
    <h1 id="tripname">旅程</h1>
    <p id="tripsubtitle" class="subtitle"></p>
    <ul class="stats">
      <li><span class="label">目的地</span><span id="statdest"></span></li>
      <li><span class="label">天數</span><span id="statdays"></span></li>
      <li><span class="label">地點</span><span id="statplaces"></span></li>
      <li class="totalstat"><span class="label">總花費</span><span id="stattotal" class="masked">••••</span>
        <button id="eyetoggle" class="eyebtn" type="button" aria-pressed="false" aria-label="顯示總花費"></button></li>
    </ul>
    <button id="syncpill" class="syncpill" type="button" hidden></button>
  </div>
</header>

<nav id="pagenav" class="pagenav" role="tablist" aria-label="頁面">
  <button role="tab" data-page="plan" aria-selected="true">行程規劃</button>
  <button role="tab" data-page="expenses" aria-selected="false">費用總覽</button>
  <button role="tab" data-page="packing" aria-selected="false">攜帶用品</button>
</nav>

<main>
  <section id="workspace" data-page="plan">
    <div class="leftcol">
      <section id="mappanel" class="frame panel" aria-label="地圖">
        <div id="mapheading" class="panelhead">
          <h2>地圖</h2>
          <div class="mapbuttons">
            <button id="previewroute" type="button">路徑預覽</button>
            <button id="fit" type="button" class="active">整天概覽</button>
          </div>
        </div>
        <div id="map" class="mapbox"></div>
        <div id="maplinks" class="maplinks"></div>
      </section>
      <details id="routepanel" class="frame panel" open>
        <summary id="summary" class="panelhead"><h2>交通明細</h2><span id="routesum" class="routesum"></span></summary>
        <div id="routelist" class="routelist"></div>
      </details>
      <details id="daycostpanel" class="frame panel" open>
        <summary class="panelhead"><h2>費用明細</h2><span id="daycostsum" class="routesum"></span><button type="button" id="daycostadd" class="sumadd" aria-label="新增當日費用" title="新增費用">＋</button></summary>
        <div id="daycostlist" class="routelist"></div>
      </details>
    </div>

    <section id="calendarpanel" class="frame panel" aria-label="行事曆">
      <div id="paneltoolbar" class="panelhead">
        <div class="caltitle"><h2>行事曆</h2><span id="calmonth" class="calmonth"></span></div>
        <div id="calendar-viewtoggle" class="viewtoggle" role="group" aria-label="檢視">
          <button type="button" data-view="week" aria-pressed="true">週</button>
          <button type="button" data-view="day" aria-pressed="false">單日</button>
        </div>
        <div id="toolbarbuttons" class="toolbarbuttons">
          <button type="button" id="undobtn" class="ghost" title="復原 (Ctrl+Z)">復原</button>
          <button type="button" id="addbtn" class="addbtn" title="新增地點"><span class="addfull">＋ 新增地點</span><span class="addshort" aria-hidden="true">＋</span></button>
        </div>
      </div>
      <div id="timeline-dates" class="timeline-dates"></div>
      <div id="calendar"></div>
    </section>
  </section>

  <section id="expensespage" hidden></section>
  <section id="packingpage" hidden></section>
</main>

<div id="toolfab" class="toolfab">
  <ul id="toolmenu" class="toolmenu" role="menu" hidden>
    <li role="none" class="viewerrow"><label for="viewersel">查看費用</label><select id="viewersel" aria-label="選擇旅客，只看其分攤費用"></select></li>
    <li role="none"><button role="menuitem" data-act="add">新增行程</button></li>
    <li role="none"><button role="menuitem" data-act="undo">復原</button></li>
    <li role="none"><button role="menuitem" data-act="export-json">匯出 JSON</button></li>
    <li role="none"><button role="menuitem" data-act="import-json">匯入 JSON</button></li>
    <li role="none"><button role="menuitem" data-act="export-ics">匯出 ICS 行事曆</button></li>
    <li role="none"><button role="menuitem" data-act="settings">旅客與匯率</button></li>
    <li role="none"><button role="menuitem" data-act="todo">待查項目</button></li>
    <li role="none"><button role="menuitem" data-act="reset" class="danger">重設為原始資料</button></li>
  </ul>
  <button id="fabbtn" class="fabbtn" type="button" aria-haspopup="menu" aria-expanded="false" aria-controls="toolmenu" aria-label="工具">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" fill="none"/></svg>
  </button>
</div>

<div id="preview" class="previewpop frame" role="dialog" aria-modal="false" hidden></div>
<dialog id="editdialog" class="frame"></dialog>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<div id="cloudgate" class="cloudgate" hidden></div>
<input type="file" id="importfile" accept="application/json,.json" hidden>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
<script src="data/trip-data.js"></script>
<script src="data/firebase-config.js"></script>
<script src="js/illustrations.js"></script>
<script src="js/app.js"></script>
<script src="js/sync.js"></script>
</body>
</html>
